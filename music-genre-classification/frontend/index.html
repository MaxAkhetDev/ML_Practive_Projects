<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music Genre Classifier</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎵 Music Genre Classifier</h1>
      <p class="subtitle">Deep learning powered by MFCC features · 10 genres</p>
    </header>

    <div id="drop-zone" class="drop-zone">
      <div class="drop-inner">
        <span class="icon">🎧</span>
        <p>Drag & drop an audio file here<br>or <label for="file-input" class="browse-link">browse</label></p>
        <p class="formats">Supports WAV · MP3 · OGG · FLAC</p>
        <input type="file" id="file-input" accept=".wav,.mp3,.ogg,.flac,audio/*" hidden/>
      </div>
    </div>

    <div id="status" class="status hidden"></div>

    <div id="result-section" class="result-section hidden">
      <div class="top-result">
        <div class="genre-badge" id="genre-badge">—</div>
        <div class="confidence" id="confidence-text">—</div>
      </div>
      <div class="chart" id="chart"></div>
      <button id="reset-btn" class="btn-reset">Classify Another Track</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
